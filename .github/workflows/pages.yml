name: Deploy demo to GitHub Pages

# The offline single-file build, published on every push to main.
# Served as the anroleroux GitHub Pages project site, which the user
# site's custom domain puts at anroleroux.co.za/veqir — so the build
# is made with that base path and needs no CNAME of its own.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # make, awk and sed are already on the runner — nothing to install.
      - name: Build the offline single-file demo
        run: make dev BASE=/veqir/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

      - id: deploy
        uses: actions/deploy-pages@v4
